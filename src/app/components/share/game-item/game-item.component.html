<div class="game-item-container">
  <img src="{{rawgGame?.background_image}}" style="width: 50px; height: 50px">
  <span class="game-name">{{rawgGame?.name}}</span>
  <button mat-icon-button color="primary" (click)="onAddGame()" title="Ajouter le jeu">
    <mat-icon>{{ isGameSelected() ? 'check_circle' : 'add' }}</mat-icon>
  </button>
</div>
